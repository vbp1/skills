<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Option Gallery</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8f6f1;
        --surface: #fffdfa;
        --surface-2: #eee7dc;
        --text: #221f1b;
        --muted: #756b5f;
        --border: rgba(34, 31, 27, 0.14);
        --accent: #9f1239;
        --accent-soft: rgba(159, 18, 57, 0.1);
        --good: #0f766e;
        --good-soft: rgba(15, 118, 110, 0.1);
        --gold: #b45309;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11100e;
          --surface: #1a1815;
          --surface-2: #25211d;
          --text: #f4eee5;
          --muted: #b5aa9c;
          --border: rgba(244, 238, 229, 0.13);
          --accent: #fb7185;
          --accent-soft: rgba(251, 113, 133, 0.13);
          --good: #2dd4bf;
          --good-soft: rgba(45, 212, 191, 0.12);
          --gold: #fbbf24;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(
            circle at 50% 0,
            var(--accent-soft),
            transparent 32rem
          ),
          var(--bg);
        color: var(--text);
        font:
          15px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: min(1240px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(30px, 4vw, 48px);
        line-height: 1.05;
      }
      h2,
      h3 {
        margin: 0;
      }
      p {
        margin: 0;
      }
      .muted {
        color: var(--muted);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 20px;
        margin-top: 24px;
        align-items: start;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .option-card {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        background: var(--surface-2);
        cursor: pointer;
        text-align: left;
      }
      .option-card[aria-pressed="true"] {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
        background: var(--accent-soft);
      }
      .preview {
        margin: 12px 0;
        min-height: 180px;
        border: 1px solid var(--border);
        border-radius: 9px;
        overflow: hidden;
        background: var(--surface);
      }
      .mock-toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px;
        border-bottom: 1px solid var(--border);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.55;
      }
      .mock-body {
        display: grid;
        gap: 10px;
        padding: 12px;
      }
      .mock-row {
        height: 18px;
        border-radius: 6px;
        background: var(--border);
      }
      .mock-row.short {
        width: 60%;
      }
      .mock-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .mock-tile {
        min-height: 48px;
        border-radius: 7px;
        background: var(--good-soft);
        border: 1px solid var(--border);
      }
      .option-card[data-kind="dense"] .mock-body {
        gap: 5px;
        padding: 8px;
      }
      .option-card[data-kind="dense"] .mock-row {
        height: 12px;
      }
      .option-card[data-kind="focused"] .mock-grid {
        grid-template-columns: 1fr;
      }
      .option-card[data-kind="editorial"] .mock-body {
        padding: 18px;
        gap: 14px;
      }
      .badge {
        display: inline-flex;
        border-radius: 999px;
        padding: 3px 8px;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .badge.good {
        color: var(--good);
        background: var(--good-soft);
      }
      .traits {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .summary {
        display: grid;
        gap: 10px;
        margin: 12px 0;
      }
      .summary-item {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-2);
      }
      textarea {
        width: 100%;
        min-height: 92px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        background: var(--surface-2);
        font: inherit;
        resize: vertical;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }
      button {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--text);
        background: var(--surface);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }
      .fallback {
        display: none;
        margin-top: 12px;
      }
      @media (max-width: 980px) {
        .layout,
        .gallery {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="title">UI Direction Gallery</h1>
        <p id="goal" class="muted">
          Choose the visual and interaction direction before implementation.
        </p>
      </header>

      <div class="layout">
        <section class="panel">
          <div id="gallery" class="gallery" aria-label="UI options"></div>
        </section>
        <aside class="panel">
          <h2>Selected Option</h2>
          <div id="summary" class="summary"></div>
          <label>
            <span class="muted">Notes or combinations</span>
            <textarea
              id="notes"
              placeholder="Example: Use the dense layout, but keep the focused empty state."
            ></textarea>
          </label>
          <div class="actions">
            <button class="primary" type="button" data-copy="summary">
              Copy decision summary
            </button>
            <button type="button" data-copy="prompt">Copy agent prompt</button>
            <button type="button" data-copy="json">Copy JSON</button>
          </div>
          <p
            id="copy-status"
            class="muted"
            role="status"
            aria-live="polite"
          ></p>
          <textarea id="fallback" class="fallback"></textarea>
        </aside>
      </div>
    </main>

    <script>
      const data = {
        title: "UI Direction Gallery",
        goal: "Choose the visual and interaction direction before implementation.",
        nextAction: "implement the selected UI direction",
        options: [
          {
            id: "dense",
            label: "Dense operations view",
            summary: "Prioritize scanning, comparison, and repeated use.",
            impact:
              "Best for internal tools, dashboards, and workflows with many records.",
            traits: ["compact", "table-first", "low decoration"],
            recommended: true,
          },
          {
            id: "focused",
            label: "Focused task flow",
            summary: "Guide the user through one primary action at a time.",
            impact:
              "Best when mistakes are costly or the workflow has clear steps.",
            traits: ["wizard-like", "clear hierarchy", "lower cognitive load"],
            recommended: false,
          },
          {
            id: "editorial",
            label: "Editorial explanation view",
            summary: "Use larger sections and more narrative context.",
            impact:
              "Best for reports, onboarding, and decision memos, not daily operations.",
            traits: ["spacious", "narrative", "presentation-ready"],
            recommended: false,
          },
        ],
      };

      const state = {
        selected:
          data.options.find((option) => option.recommended)?.id ||
          data.options[0].id,
        notes: "",
      };

      function renderPreview(kind) {
        return `
    <div class="preview">
      <div class="mock-toolbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="mock-body">
        <div class="mock-row"></div>
        <div class="mock-row short"></div>
        <div class="mock-grid">
          <div class="mock-tile"></div>
          <div class="mock-tile"></div>
          <div class="mock-tile"></div>
          <div class="mock-tile"></div>
        </div>
        ${kind === "dense" ? '<div class="mock-row"></div><div class="mock-row"></div>' : ""}
      </div>
    </div>
  `;
      }

      function renderGallery() {
        document.getElementById("gallery").innerHTML = data.options
          .map(
            (option) => `
    <button class="option-card" type="button" data-option="${option.id}" data-kind="${option.id}" aria-pressed="${state.selected === option.id}">
      <h3>${option.label}</h3>
      ${renderPreview(option.id)}
      <p>${option.summary}</p>
      <p class="muted">${option.impact}</p>
      <div class="traits">
        ${option.recommended ? '<span class="badge good">Recommended</span>' : ""}
        ${option.traits.map((trait) => `<span class="badge">${trait}</span>`).join("")}
      </div>
    </button>
  `,
          )
          .join("");
      }

      function selectedOption() {
        return data.options.find((option) => option.id === state.selected);
      }

      function buildExport() {
        const selected = selectedOption();
        const decisions = [
          {
            id: "ui-direction",
            label: "UI direction",
            value: selected.id,
            summary: selected.summary,
            rationale: selected.recommended
              ? "Recommended default accepted."
              : "Selected by user.",
            impact: selected.impact,
            confidence: "high",
          },
        ];
        return {
          title: data.title,
          goal: data.goal,
          version: 1,
          completedAt: new Date().toISOString(),
          status: "complete",
          decisions,
          notes: state.notes.trim(),
          openQuestions: [],
          agentPrompt: buildPrompt(decisions),
        };
      }

      function buildPrompt(decisions) {
        const selected = selectedOption();
        return `Use this UI direction as the source of truth.

Goal: ${data.goal}

Selected direction: ${selected.label}
Meaning: ${selected.summary}
Impact: ${selected.impact}
Traits: ${selected.traits.join(", ")}

Notes:
${state.notes.trim() || "None"}

Continue by ${data.nextAction}. Preserve the selected traits unless implementation constraints make them impossible.`;
      }

      function buildSummary(exportData) {
        const selected = selectedOption();
        return `# Decision Summary: ${exportData.title}

Goal: ${exportData.goal}
Status: complete

## Selected Decisions

- UI direction: ${selected.label} — ${selected.impact}

## Notes

${exportData.notes || "None"}
`;
      }

      function renderSummary() {
        const selected = selectedOption();
        document.getElementById("summary").innerHTML = `
    <div class="summary-item">
      <strong>${selected.label}</strong>
      <p>${selected.summary}</p>
      <p class="muted">${selected.impact}</p>
    </div>
  `;
      }

      async function copyText(kind) {
        const exportData = buildExport();
        const text =
          kind === "json"
            ? JSON.stringify(exportData, null, 2)
            : kind === "prompt"
              ? exportData.agentPrompt
              : buildSummary(exportData);
        const fallback = document.getElementById("fallback");
        try {
          await navigator.clipboard.writeText(text);
          fallback.style.display = "none";
          document.getElementById("copy-status").textContent =
            `Copied ${kind}.`;
        } catch {
          fallback.value = text;
          fallback.style.display = "block";
          fallback.focus();
          fallback.select();
          document.getElementById("copy-status").textContent =
            "Clipboard unavailable. Select and copy the text below.";
        }
      }

      document.addEventListener("click", (event) => {
        const optionButton = event.target.closest("[data-option]");
        if (optionButton) {
          state.selected = optionButton.dataset.option;
          renderGallery();
          renderSummary();
        }
        if (event.target.matches("[data-copy]"))
          copyText(event.target.dataset.copy);
      });
      document.addEventListener("input", (event) => {
        if (event.target.id === "notes") {
          state.notes = event.target.value;
          renderSummary();
        }
      });
      document.getElementById("title").textContent = data.title;
      document.getElementById("goal").textContent = data.goal;
      renderGallery();
      renderSummary();
    </script>
  </body>
</html>
